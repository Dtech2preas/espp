[env:esp32dev]
platform = espressif32@5.3.0
board = esp32dev
framework = arduino
upload_port = COM4
platform_packages =
    framework-arduinoespressif32 @ https://github.com/tasmota/arduino-esp32/releases/download/2.0.2.3/framework-arduinoespressif32-release_IDF4.4.tar.gz
build_flags =
    -D CONFIG_LWIP_IP_FORWARD=1
    -D CONFIG_LWIP_L2_TO_L3_COPY=1
    -D CONFIG_LWIP_IPV4_NAPT=1